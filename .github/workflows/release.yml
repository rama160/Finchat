name: FinChat Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0'
        required: true
        default: 'v0.2.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name finchat --org com.finchat --no-pub .
          fi
      - name: Configure Android security storage
        shell: bash
        run: |
          python3 - <<'PYCFG'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace("<application", "<application android:allowBackup=\"false\"", 1) if "android:allowBackup" not in text else text
              manifest.write_text(text)
          PYCFG
      - run: flutter build apk --release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
