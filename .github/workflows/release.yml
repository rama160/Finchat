name: FinChat Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.3.5+20'
        required: true
        default: 'v0.3.5+20'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Check source consistency
        run: python3 tooling/check_repository.py
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name finchat --org com.finchat --no-pub .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Configure Android release, permissions, and R8
        run: python3 tooling/android/configure_android_ci.py
      - name: Restore permanent release keystore
        env:
          FINCHAT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FINCHAT_UPLOAD_KEYSTORE_BASE64 }}
          FINCHAT_KEY_ALIAS: ${{ secrets.FINCHAT_KEY_ALIAS }}
          FINCHAT_KEY_PASSWORD: ${{ secrets.FINCHAT_KEY_PASSWORD }}
          FINCHAT_STORE_PASSWORD: ${{ secrets.FINCHAT_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in FINCHAT_UPLOAD_KEYSTORE_BASE64 FINCHAT_KEY_ALIAS FINCHAT_KEY_PASSWORD FINCHAT_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required permanent release secret is missing: $name" >&2
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$FINCHAT_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$FINCHAT_STORE_PASSWORD
          keyPassword=$FINCHAT_KEY_PASSWORD
          keyAlias=$FINCHAT_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks
      - name: Show permanent signing certificate SHA-1
        env:
          FINCHAT_KEY_ALIAS: ${{ secrets.FINCHAT_KEY_ALIAS }}
          FINCHAT_STORE_PASSWORD: ${{ secrets.FINCHAT_STORE_PASSWORD }}
        shell: bash
        run: |
          keytool -list -v -keystore android/app/upload-keystore.jks -alias "$FINCHAT_KEY_ALIAS" -storepass "$FINCHAT_STORE_PASSWORD" | grep -E 'SHA1:|SHA-1:'
      - name: Build release APK
        env:
          FINCHAT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.FINCHAT_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${FINCHAT_GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            flutter build apk --release --dart-define=FINCHAT_GOOGLE_SERVER_CLIENT_ID="$FINCHAT_GOOGLE_SERVER_CLIENT_ID"
          else
            echo "FINCHAT_GOOGLE_SERVER_CLIENT_ID is not configured; using the app's built-in Google client ID."
            flutter build apk --release
          fi
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finchat-release-apk-${{ inputs.tag }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Verify release tag matches pubspec version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          text=open('pubspec.yaml', encoding='utf-8').read()
          print(re.search(r'^version:\s*["\']([^"\']+)["\']', text, re.M).group(1))
          PY
          )
          EXPECTED="v${VERSION}"
          if [ "${{ inputs.tag }}" != "$EXPECTED" ]; then
            echo "Tag ${{ inputs.tag }} tidak cocok dengan versi pubspec $VERSION (expected $EXPECTED)."
            exit 1
          fi
      - name: Generate APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
