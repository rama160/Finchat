name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name finchat --org com.finchat --no-pub .
          fi
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android project was not generated correctly."
            find android -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi
      - name: Configure Android R8 rules for ML Kit optional languages
        shell: bash
        run: |
          python3 - <<'PYCFG'
          from pathlib import Path
          rules = Path("tooling/android/proguard-rules.pro")
          target = Path("android/app/proguard-rules.pro")
          target.write_text(rules.read_text())

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if groovy.exists():
              gradle = groovy
              text = gradle.read_text()
              if "proguard-rules.pro" not in text:
                  marker = "release {"
                  replacement = "release {\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
                  if marker not in text:
                      raise SystemExit("Could not locate release build type in android/app/build.gradle")
                  text = text.replace(marker, replacement, 1)
                  gradle.write_text(text)
          elif kotlin.exists():
              gradle = kotlin
              text = gradle.read_text()
              if "proguard-rules.pro" not in text:
                  marker = "buildTypes {"
                  if marker not in text:
                      raise SystemExit("Could not locate buildTypes in android/app/build.gradle.kts")
                  release_marker = "release {"
                  if release_marker in text:
                      replacement = "release {\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")"
                      text = text.replace(release_marker, replacement, 1)
                  else:
                      raise SystemExit("Could not locate release build type in android/app/build.gradle.kts")
                  gradle.write_text(text)
          else:
              raise SystemExit("Neither android/app/build.gradle nor build.gradle.kts exists")
          PYCFG
      - name: Configure Android security storage
        shell: bash
        run: |
          python3 - <<'PYCFG'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace("<application", "<application android:allowBackup=\"false\"", 1) if "android:allowBackup" not in text else text
              manifest.write_text(text)
          PYCFG
      - name: Configure Android speech permissions
        shell: bash
        run: |
          python3 - <<'PYCFG'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("\n    <application", "\n    " + permission + "\n    <application", 1)
          query = """<queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>"""
          if '<queries>' not in text:
              text = text.replace("\n    <application", "\n    " + query + "\n    <application", 1)
          manifest.write_text(text)
          PYCFG
      - name: Build release APK
        run: flutter build apk --release --dart-define=FINCHAT_GOOGLE_SERVER_CLIENT_ID=${{ secrets.FINCHAT_GOOGLE_SERVER_CLIENT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
