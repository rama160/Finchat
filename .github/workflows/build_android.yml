name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate Android platform if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name finchat --org com.finchat --no-pub .
          fi
      - name: Configure Android speech permissions
        shell: bash
        run: |
          python3 - <<'PYCFG'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("\n    <application", "\n    " + permission + "\n    <application", 1)
          query = """<queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>"""
          if '<queries>' not in text:
              text = text.replace("\n    <application", "\n    " + query + "\n    <application", 1)
          manifest.write_text(text)
          PYCFG
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
