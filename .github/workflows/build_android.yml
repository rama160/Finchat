name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name finchat --org com.finchat --no-pub .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Configure Android release, permissions, and R8
        run: python3 tooling/android/configure_android_ci.py

      - name: Generate Keystore & Extract SHA-1 Fingerprint
        run: |
          mkdir -p /home/runner/.config/.android/
          keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cd android
          ./gradlew signingReport

      - name: Build release APK
        run: flutter build apk --release --dart-define=FINCHAT_GOOGLE_SERVER_CLIENT_ID=${{ secrets.FINCHAT_GOOGLE_SERVER_CLIENT_ID }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
