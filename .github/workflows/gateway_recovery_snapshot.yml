name: Gateway Recovery Snapshot Validation
on:
  push:
    branches: [codex/gateway-recovery-validation]
    paths: ['tooling/gateway-recovery/**', '.github/workflows/gateway_recovery_snapshot.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/gateway-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Export resolved dependency lock
        run: |
          node -e "const s = require('fs').readFileSync('package-lock.json').toString('base64'); console.log('GATEWAY_LOCK_START'); for (let i=0; i<s.length; i+=4000) console.log('GATEWAY_LOCK_CHUNK:'+s.slice(i,i+4000)); console.log('GATEWAY_LOCK_END');"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/gateway-dry-run
