name: finchat
description: Offline-first personal finance assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  image: ^4.10.1
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  googleapis: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
