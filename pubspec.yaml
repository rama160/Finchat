name: finchat
description: "Offline-first personal finance assistant."
publish_to: "none"
version: "0.3.2+16"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  image: ^4.10.1
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  google_sign_in_platform_interface: ^3.1.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/LICENSE.txt
  fonts:
    - family: SpenvaSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
