name = "finchat-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-28"
workers_dev = true

[vars]
MODEL_PRIMARY = "gemini-3.5-flash-lite"
MODEL_FALLBACK_1 = "gemini-3.1-flash-lite"
MODEL_FALLBACK_2 = "gemini-2.5-flash-lite"
RATE_LIMIT_PER_MINUTE = "20"
FREE_DAILY_REQUESTS = "50"
MAX_REQUEST_BYTES = "20000"
REQUEST_TIMEOUT_MS = "10000"
MODEL_COOLDOWN_SECONDS = "60"

# Create KV namespaces before deployment and replace the placeholder IDs.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "USAGE_KV"
id = "REPLACE_WITH_USAGE_KV_ID"

[[kv_namespaces]]
binding = "HEALTH_KV"
id = "REPLACE_WITH_HEALTH_KV_ID"

